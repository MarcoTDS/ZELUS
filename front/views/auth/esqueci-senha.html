<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body>
    <!-- 1.2 Tela "Esqueci a Senha" (RF19, RN16) -->
    <main class="tela-auth">
        <div class="cartao-auth">
            <header class="text-center mb-4">
                <h1 class="h4 mb-1">Esqueceu a senha?</h1>
                <p class="texto-suave mb-0">Informe seu e-mail para receber o link de redefinição.</p>
            </header>

            <form id="form-esqueci" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="nome@email.com" autocomplete="email" required>
                    <div class="invalid-feedback">Informe um e-mail válido.</div>
                </div>

                <div id="alerta"></div>

                <button type="submit" id="btn-enviar" class="btn btn-zelus w-100">Enviar link de redefinição</button>
            </form>

            <p class="text-center small mt-3 mb-0">
                <a href="login.html">Voltar para o login</a>
            </p>
        </div>
    </main>

    <script type="module" src="../../scripts/auth/esqueci-senha.js"></script>
</body>
</html>
