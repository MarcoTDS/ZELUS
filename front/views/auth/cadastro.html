<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body class="pagina-login d-flex align-items-center justify-content-center">

  <button
    type="button"
    id="btnTema"
    class="btn btn-outline-secondary btn-tema position-fixed top-0 end-0 m-3"
    aria-label="Mudar para modo escuro"
  >
    <svg
      class="icone-lua"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>

    <svg
      class="icone-sol d-none"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <div class="card shadow-sm card-login" style="max-width: 420px;">
    <div class="card-body p-4">

      <h1 class="h5 mb-4">Cadastro</h1>

      <div id="alerta"></div>

      <form id="form-cadastro">
        <!-- O e-mail vem primeiro: a consulta no banco define quais campos aparecem -->
        <div class="mb-3">
          <label for="email" class="form-label small">E-mail</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="nome@email.com"
            autocomplete="email"
            required
          >
          <div class="form-text" id="info-email" aria-live="polite">Digite seu e-mail para continuar.</div>
        </div>

        <div class="mb-3" id="grupo-nome" hidden>
          <label for="nome" class="form-label small">Nome Completo</label>
          <input
            type="text"
            class="form-control"
            id="nome"
            placeholder="Seu nome"
            minlength="3"
            required
            disabled
          >
        </div>

        <div class="mb-3" id="grupo-senha" hidden>
          <label for="senha" class="form-label small" id="rotulo-senha">Senha</label>
          <input
            type="password"
            class="form-control"
            id="senha"
            placeholder="••••••••"
            required
            disabled
          >
          <div class="form-text" id="ajuda-senha"></div>
        </div>

        <div id="grupo-unidades" hidden>
          <div class="mb-3">
            <label for="condominio" class="form-label small">Condomínio</label>
            <!-- A lista é preenchida pelo script, com os dados do banco -->
            <select class="form-select" id="condominio" required disabled>
              <option selected disabled value="">Carregando...</option>
            </select>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label small mb-1">Unidade(s)</legend>
            <!-- Caixas de seleção montadas pelo script depois de escolher o condomínio -->
            <div class="lista-unidades-cadastro" id="lista-unidades">
              <p class="small texto-suave mb-0">Escolha o condomínio antes.</p>
            </div>
            <div class="form-text">Marque todas as unidades em que você mora ou é responsável.</div>
            <!-- Estilo no próprio elemento (e não a classe d-block), para o atributo hidden conseguir esconder a mensagem -->
            <div class="invalid-feedback" style="display: block;" id="erro-unidades" hidden>Selecione ao menos uma unidade.</div>
          </fieldset>

          <div class="alert alert-zelus small mb-3" role="alert">
            Seu cadastro ficará pendente até aprovação do síndico.
          </div>

          <button type="submit" id="btn-enviar" class="btn btn-zelus w-100 mb-3">
            Enviar Solicitação
          </button>
        </div>
      </form>

      <p class="text-center small text-muted mb-0">
        Já tem conta?
        <a href="login.html" class="link-zelus">
          <u>Entrar</u>
        </a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/auth/cadastro.js"></script>
</body>
</html>
