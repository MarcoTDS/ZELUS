<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body class="pagina-login d-flex align-items-center justify-content-center">

  <button
    type="button"
    id="btnTema"
    class="btn btn-outline-secondary btn-tema position-fixed top-0 end-0 m-3"
    aria-label="Mudar para modo escuro"
  >
    <svg
      class="icone-lua"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>

    <svg
      class="icone-sol d-none"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <div class="card shadow-sm card-login">
    <div class="card-body p-4">

      <div class="text-center mb-4">

        <!-- Figura com fundo roxo e engrenagem animada -->
        <div class="logo-zelus">
          <svg
            class="figura-zelus"
            viewBox="0 0 400 400"
            role="img"
            aria-label="Logo Zelus: engrenagem entre ferramentas"
          >
            <g class="ferramentas-zelus">
              <!-- Chave de fenda -->
              <path d="
                M 128 128 L 102 102
                M 102 102 L 83 108 L 60 77
                L 72 65 L 104 87 Z
              "/>

              <!-- Parte superior da chave de boca -->
              <path d="
                M 254 113
                C 246 87, 265 60, 291 59
                C 305 57, 307 62, 297 72
                L 283 86
                C 274 97, 280 110, 289 117
                C 299 126, 311 126, 321 116
                L 335 102
                C 344 92, 348 98, 345 111
                C 341 138, 319 155, 289 149
              "/>

              <!-- Cabo da chave de fenda -->
              <path d="
                M 286 247 L 336 297
                Q 346 307, 336 317
                L 318 335
                Q 308 345, 298 335
                L 248 285
              "/>

              <!-- Parte inferior da chave de boca -->
              <path d="
                M 113 254
                C 87 246, 60 265, 59 291
                C 57 305, 62 307, 72 297
                L 86 283
                C 97 274, 110 280, 117 289
                C 126 299, 126 311, 116 321
                L 102 335
                C 92 344, 98 348, 111 345
                C 138 341, 155 319, 149 289
              "/>
            </g>

            <g class="engrenagem-zelus">
              <path d="
                M 184 112 L 216 112
                L 216 133 L 237 142
                L 252 127 L 275 150
                L 260 165 L 269 184
                L 290 184 L 290 216
                L 269 216 L 260 237
                L 275 252 L 252 275
                L 237 260 L 216 269
                L 216 290 L 184 290
                L 184 269 L 163 260
                L 148 275 L 125 252
                L 140 237 L 131 216
                L 110 216 L 110 184
                L 131 184 L 140 165
                L 125 150 L 148 127
                L 163 142 L 184 133 Z
              "/>

              <circle cx="200" cy="200" r="39"/>
            </g>
          </svg>
        </div>

        <h1 class="h5 mb-1">Zelus</h1>
        <p class="text-muted small mb-0">
          HelpDesk de Manutenção Condominial
        </p>
      </div>

      <div id="alerta"></div>

      <form id="form-login">
        <div class="mb-3">
          <label for="email" class="form-label small">E-mail</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="nome@email.com"
            autocomplete="username"
            required
          >
        </div>

        <div class="mb-2">
          <label for="senha" class="form-label small">Senha</label>
          <input
            type="password"
            class="form-control"
            id="senha"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="text-end mb-3"><a href="esqueci-senha.html" class="link-zelus small">Esqueceu a senha?</a></div>
        
        <button type="submit" id="btn-entrar" class="btn btn-zelus w-100 mb-3 mt-3">
          Entrar
        </button>
      </form>

      <p class="text-center small text-muted mb-0">
        É morador e ainda não tem conta?
        <a href="cadastro.html" class="link-zelus">
          <u>Cadastre-se</u>
        </a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../scripts/auth/login.js"></script>
</body>
</html>
