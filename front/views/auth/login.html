<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body>
    <!-- 1.1 Tela de Login (RF01) -->
    <main class="tela-auth">
        <div class="cartao-auth">
            <header class="text-center mb-4">
                <h1 class="h3 marca">Zelus</h1>
                <p class="texto-suave mb-0">HelpDesk de Manutenção Condominial</p>
            </header>

            <div id="alerta"></div>

            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="nome@email.com" autocomplete="email" required>
                    <div class="invalid-feedback">Informe um e-mail válido.</div>
                </div>

                <div class="mb-1">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha"
                           autocomplete="current-password" required>
                    <div class="invalid-feedback">Informe a sua senha.</div>
                </div>

                <div class="text-end mb-3">
                    <a href="esqueci-senha.html" class="small">Esqueceu a senha?</a>
                </div>

                <button type="submit" id="btn-entrar" class="btn btn-zelus w-100">Entrar</button>
            </form>

            <p class="text-center small mt-3 mb-0">
                É morador e ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </main>

    <script type="module" src="../../scripts/auth/login.js"></script>
</body>
</html>
