<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body>
    <!-- Redefinir senha pelo link do e-mail (RN16). Aberta a partir de redefinir-senha.html?token=... -->
    <main class="tela-auth">
        <div class="cartao-auth">
            <header class="mb-4">
                <h1 class="h4 mb-1">Redefinir senha</h1>
                <p class="texto-suave mb-0">Escolha uma nova senha para acessar o Zelus.</p>
            </header>

            <div id="alerta"></div>

            <form id="form-redefinir" novalidate>
                <div class="mb-3">
                    <label for="nova_senha" class="form-label">Nova senha</label>
                    <input type="password" class="form-control" id="nova_senha" name="nova_senha"
                           autocomplete="new-password" minlength="6" maxlength="72" required>
                    <div class="invalid-feedback">A nova senha deve ter entre 6 e 72 caracteres.</div>
                </div>

                <div class="mb-4">
                    <label for="confirmar_nova_senha" class="form-label">Confirmar nova senha</label>
                    <input type="password" class="form-control" id="confirmar_nova_senha" name="confirmar_nova_senha"
                           autocomplete="new-password" required>
                    <div class="invalid-feedback">A confirmação não confere com a nova senha.</div>
                </div>

                <button type="submit" id="btn-redefinir" class="btn btn-zelus w-100">Redefinir senha</button>
            </form>

            <p class="text-center small mt-3 mb-0">
                <a href="esqueci-senha.html">Solicitar um novo link</a> · <a href="login.html">Voltar para o login</a>
            </p>
        </div>
    </main>

    <script type="module" src="../../scripts/auth/redefinir-senha.js"></script>
</body>
</html>
