<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar e-mail | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body>
    <!-- Validação do e-mail do síndico pelo link (RN12). Aberta a partir de validar-email.html?token=... -->
    <main class="tela-auth">
        <div class="cartao-auth text-center">
            <h1 class="h4 mb-3">Validação de e-mail</h1>

            <div id="carregando" class="texto-suave mb-3">
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Validando seu e-mail...
            </div>

            <div id="alerta" class="text-start"></div>

            <a href="login.html" id="btn-login" class="btn btn-zelus w-100" hidden>Ir para o login</a>
        </div>
    </main>

    <script type="module" src="../../scripts/auth/validar-email.js"></script>
</body>
</html>
