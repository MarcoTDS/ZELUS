<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Perfil | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões (usados pelo layout.js e por esta tela) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>
<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <!-- Tela Editar Perfil do morador (RF15) -->
  <main class="zelus-pagina">

    <a href="../morador/dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>

    <p class="rotulo-pagina mt-3">Morador</p>
    <h1 class="h3 mb-3">Meu perfil</h1>

    <div id="alerta"></div>

    <!-- ===== Dados pessoais ===== -->
    <form id="form-dados" class="card shadow-sm mb-3" novalidate>
      <div class="card-body p-4">

        <h2 class="h6 fw-semibold mb-3">Dados pessoais</h2>

        <div class="mb-3">
          <label for="nome" class="form-label small">Nome completo</label>
          <input type="text" class="form-control" id="nome" name="nome" minlength="3" maxlength="150" required disabled>
          <div class="invalid-feedback">Informe seu nome (mínimo 3 caracteres).</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small">E-mail (login)</label>
          <input type="email" class="form-control" id="email" name="email" maxlength="150" required disabled>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <!-- Só leitura: unidade e condomínio são definidos no cadastro / pelo síndico -->
        <div class="row g-2 mb-1">
          <div class="col-md-6">
            <label for="unidade" class="form-label small">Unidade</label>
            <input type="text" class="form-control" id="unidade" readonly disabled>
          </div>
          <div class="col-md-6">
            <label for="condominio" class="form-label small">Condomínio</label>
            <input type="text" class="form-control" id="condominio" readonly disabled>
          </div>
        </div>
        <p class="form-text mb-0">Para trocar de unidade, fale com o síndico.</p>

        <button type="submit" class="btn btn-zelus w-100 mt-4" id="btn-salvar" disabled>Salvar dados</button>

      </div>
    </form>

    <!-- A troca de senha fica em outra tela -->
    <p class="small texto-suave">
      Quer trocar a senha? <a href="alterar-senha.html" class="link-zelus">Alterar senha</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/comum/perfil.js"></script>
</body>
</html>
