<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico de Chamados | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões (usados pelo layout.js e por esta tela) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>
<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <!-- Tela Histórico de Chamados (RF22) -->
  <main class="zelus-pagina">

    <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>

    <p class="rotulo-pagina mt-3">Síndico</p>
    <h1 class="h3 mb-1">Histórico de Chamados</h1>
    <p class="small texto-suave mb-3" id="resumo"></p>

    <!-- Busca por número + botão de filtro -->
    <form class="d-flex gap-2 mb-2" id="form-busca" role="search">
      <input type="search" class="form-control" id="ticket" placeholder="Buscar por nº do ticket"
             inputmode="numeric" aria-label="Buscar por número do ticket">
      <button type="submit" class="btn btn-outline-zelus" title="Buscar" aria-label="Buscar">
        <i class="bi bi-search"></i>
      </button>
      <button type="button" class="btn btn-outline-zelus position-relative" id="btn-filtro"
              title="Filtrar" aria-label="Filtrar" aria-expanded="false" aria-controls="painel-filtro">
        <i class="bi bi-funnel"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-1 rounded-circle badge-aberto d-none" id="indicador-filtro">
          <span class="visually-hidden">Filtro Ativo</span>
        </span>
      </button>
    </form>

    <!-- Painel de filtro: escondido até clicar no funil -->
    <div class="card shadow-sm mb-3 d-none" id="painel-filtro">
      <div class="card-body p-3">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label for="filtro-status" class="form-label small mb-1">Status</label>
            <select class="form-select form-select-sm" id="filtro-status">
              <option value="">Todos</option>
              <option value="Aberto">Aberto</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Vencido">Vencido</option>
              <option value="Resolvido">Resolvido</option>
              <option value="Cancelado">Cancelado</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="filtro-de" class="form-label small mb-1">Aberto de</label>
            <input type="date" class="form-control form-control-sm" id="filtro-de">
          </div>
          <div class="col-6 col-md-3">
            <label for="filtro-ate" class="form-label small mb-1">até</label>
            <input type="date" class="form-control form-control-sm" id="filtro-ate">
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button type="button" class="btn btn-link link-zelus btn-sm" id="btn-limpar">Limpar Filtros</button>
          </div>
        </div>
      </div>
    </div>

    <div id="alerta"></div>

    <!-- Lista preenchida pelo script, com os dados do banco -->
    <div id="lista-chamados">
      <p class="texto-suave">Carregando...</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/sindico/historico.js"></script>
</body>
</html>
