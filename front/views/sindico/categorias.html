<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorias | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões da lista (usados pelo layout.js e pelo categorias.js) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <main class="zelus-pagina">

    <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>

    <p class="rotulo-pagina mt-2">Síndico</p>
    <h1 class="h3 mb-3">Categorias</h1>

    <div id="alerta"></div>

    <!-- ===== Lista de categorias ===== -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="h6 fw-semibold mb-0">Categorias Cadastradas</h2>

      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch" id="mostrar-inativas">
        <label class="form-check-label small" for="mostrar-inativas">Mostrar Inativas</label>
      </div>
    </div>

    <!-- Lista preenchida pelo script, com os dados do banco -->
    <div class="mb-4" id="lista-categorias">
      <p class="texto-suave">Carregando categorias...</p>
    </div>

    <!-- ===== Formulário: nova categoria / editar ===== -->
    <form id="form-categoria" class="card shadow-sm" novalidate>
      <div class="card-body p-4">

        <h2 class="h6 fw-semibold mb-3" id="titulo-form">Cadastrar Categoria</h2>

        <div class="mb-3">
          <label for="nome" class="form-label small">Nome da Categoria</label>
          <input type="text" class="form-control" id="nome" placeholder="Ex: Hidráulica" maxlength="100" required>
          <div class="invalid-feedback">Informe o nome da categoria.</div>
        </div>

        <label for="prazo_sla" class="form-label small">Prazo de Atendimento (SLA)</label>
        <div class="row g-2 mb-1">
          <div class="col-6 col-md-4">
            <input type="number" class="form-control" id="prazo_sla" placeholder="Ex: 24" min="1" max="999" required>
            <div class="invalid-feedback">Informe um prazo maior que zero.</div>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select" id="unidade_prazo" aria-label="Unidade do prazo">
              <option value="horas" selected>Horas</option>
              <option value="dias">Dias</option>
            </select>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="button" class="btn btn-outline-secondary" id="btn-cancelar" hidden>Cancelar</button>
          <button type="submit" class="btn btn-zelus flex-fill" id="btn-salvar">Salvar Categoria</button>
        </div>

      </div>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/sindico/categorias.js"></script>
</body>
</html>
