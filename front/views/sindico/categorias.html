<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body data-protegida>
    <header id="cabecalho"></header>

    <!-- 1.12 Tela Visualizar e Cadastrar Categorias (RF08) -->
    <main class="container pagina conteudo">
        <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar</a>

        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 titulo-pagina mb-0">Categorias</h1>
            <div class="form-check form-switch small mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="mostrar-inativas">
                <label class="form-check-label" for="mostrar-inativas">Mostrar inativas</label>
            </div>
        </div>

        <div id="alerta"></div>

        <div id="lista-categorias">
            <p class="texto-suave">Carregando...</p>
        </div>

        <!-- Cadastro e edição usam o mesmo formulário -->
        <form id="form-categoria" class="cartao mt-3" novalidate>
            <h2 class="titulo-secao mt-0" id="titulo-form">Cadastrar categoria</h2>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Ex: Jardinagem"
                       required minlength="3" maxlength="100">
                <div class="invalid-feedback">Informe um nome com pelo menos 3 caracteres.</div>
            </div>

            <label for="prazo_sla" class="form-label">Prazo de SLA</label>
            <div class="row g-2 mb-3">
                <div class="col">
                    <input type="number" class="form-control" id="prazo_sla" placeholder="24" min="1" step="1" required>
                    <div class="invalid-feedback">Informe um prazo maior que zero.</div>
                </div>
                <div class="col">
                    <select class="form-select" id="unidade_prazo" aria-label="Unidade do prazo">
                        <option value="horas">Horas</option>
                        <option value="dias">Dias</option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="button" id="btn-cancelar" class="btn btn-outline-secondary" hidden>Cancelar</button>
                <button type="submit" id="btn-salvar" class="btn btn-zelus flex-grow-1">Salvar categoria</button>
            </div>
        </form>
    </main>

    <script type="module" src="../../scripts/sindico/categorias.js"></script>
</body>
</html>
