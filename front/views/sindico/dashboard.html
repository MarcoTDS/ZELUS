<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Síndico | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões (usados pelo layout.js) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <main class="zelus-pagina">

    <p class="rotulo-pagina">Dashboard</p>
    <h1 class="h3 mb-3">Síndico</h1>

    <div id="alerta"></div>

    <!-- Atalhos -->
    <div class="d-grid gap-2 mb-4">
      <a href="worklist.html" class="btn-atalho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        Fila de Chamados
      </a>

      <a href="categorias.html" class="btn-atalho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Categorias
      </a>

      <a href="cadastros-pendentes.html" class="btn-atalho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="4"/>
          <path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/>
          <polyline points="16 11 18 13 22 9"/>
        </svg>
        Cadastros Pendentes
        <span class="badge text-bg-danger rounded-pill ms-auto" id="qtd-pendentes" hidden>0</span>
      </a>
    </div>

    <!-- Resumo dos chamados -->
    <h2 class="h6 fw-semibold mb-2">Resumo</h2>

    <div class="row g-2">
      <div class="col-4">
        <div class="card-resumo">
          <p class="card-resumo-rotulo">Abertos</p>
          <p class="card-resumo-numero" id="resumo-abertos">–</p>
        </div>
      </div>
      <div class="col-4">
        <div class="card-resumo">
          <p class="card-resumo-rotulo">Urgentes</p>
          <p class="card-resumo-numero text-danger" id="resumo-urgentes">–</p>
        </div>
      </div>
      <div class="col-4">
        <div class="card-resumo">
          <p class="card-resumo-rotulo">Vencidos</p>
          <p class="card-resumo-numero text-danger" id="resumo-vencidos">–</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/sindico/dashboard.js"></script>
</body>
</html>
