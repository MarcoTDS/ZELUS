<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body data-protegida>
    <header id="cabecalho"></header>

    <!-- 1.9 Tela Dashboard do Perfil Síndico (RF03) -->
    <main class="container pagina conteudo">
        <h1 class="h4 titulo-pagina mb-3">
            <span class="sobretitulo">Dashboard</span>
            Síndico
        </h1>

        <div id="alerta"></div>

        <div class="d-grid gap-2">
            <a href="worklist.html" class="btn btn-outline-secondary bg-white text-body atalho">
                <i class="bi bi-list-task"></i> Fila de chamados
            </a>
            <a href="categorias.html" class="btn btn-outline-secondary bg-white text-body atalho">
                <i class="bi bi-grid"></i> Categorias
            </a>
            <a href="cadastros-pendentes.html" class="btn btn-outline-secondary bg-white text-body atalho">
                <i class="bi bi-person-check"></i> Aprovar cadastros
                <span id="qtd-pendentes" class="badge rounded-pill text-bg-warning ms-auto" hidden></span>
            </a>
            <a href="moradores.html" class="btn btn-outline-secondary bg-white text-body atalho">
                <i class="bi bi-people"></i> Visualizar moradores
            </a>
            <a href="unidades.html" class="btn btn-outline-secondary bg-white text-body atalho">
                <i class="bi bi-building"></i> Visualizar unidades
            </a>
        </div>

        <h2 class="titulo-secao">Resumo</h2>

        <!-- RF03: totais dos chamados em aberto (Aberto ou Em Andamento) -->
        <div class="row g-2" id="resumo">
            <div class="col-6 col-sm-4">
                <a href="worklist.html" class="resumo-item">
                    <span class="resumo-rotulo">Abertos</span>
                    <span class="resumo-valor" id="resumo-abertos">–</span>
                </a>
            </div>
            <div class="col-6 col-sm-4">
                <a href="worklist.html" class="resumo-item" title="Chamados vencidos ou perto de vencer o SLA">
                    <span class="resumo-rotulo">Urgentes</span>
                    <span class="resumo-valor text-danger" id="resumo-urgentes">–</span>
                </a>
            </div>
            <div class="col-12 col-sm-4">
                <a href="worklist.html" class="resumo-item" title="Chamados com o prazo do SLA já expirado">
                    <span class="resumo-rotulo">Vencidos</span>
                    <span class="resumo-valor text-danger" id="resumo-vencidos">–</span>
                </a>
            </div>
        </div>
    </main>

    <script type="module" src="../../scripts/sindico/dashboard.js"></script>
</body>
</html>
