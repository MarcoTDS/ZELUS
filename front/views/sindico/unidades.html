<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body data-protegida>
    <header id="cabecalho"></header>

    <!-- 1.15 Tela Gerenciamento de Unidades (RF20, RN17) -->
    <main class="container pagina conteudo">
        <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar</a>
        <h1 class="h4 titulo-pagina mb-3">Gerenciar unidades</h1>

        <div id="alerta"></div>

        <div id="lista-unidades">
            <p class="texto-suave">Carregando...</p>
        </div>

        <form id="form-unidade" class="cartao mt-3" novalidate>
            <h2 class="titulo-secao mt-0">Adicionar unidade</h2>
            <div class="row g-2 align-items-start">
                <div class="col-sm-3">
                    <select class="form-select" id="tipo_unidade" aria-label="Tipo da unidade">
                        <option value="Apartamento">Apartamento</option>
                        <option value="Casa">Casa</option>
                        <option value="Area Comum">Área comum</option>
                    </select>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="campo1" maxlength="150">
                </div>
                <div class="col" id="coluna-campo2">
                    <input type="text" class="form-control" id="campo2" maxlength="50">
                </div>
                <div class="col-12 col-sm-auto">
                    <button type="submit" id="btn-adicionar" class="btn btn-outline-secondary w-100">+ Adicionar</button>
                </div>
            </div>
        </form>
    </main>

    <script type="module" src="../../scripts/sindico/unidades.js"></script>
</body>
</html>
