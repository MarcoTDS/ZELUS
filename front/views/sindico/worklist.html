<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila de Chamados | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e da busca (usados pelo layout.js e por esta tela) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>
<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <!-- 1.10 Tela Fila de Chamados - Worklist (RF10, RN04, RN14) -->
  <main class="zelus-pagina">
    <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>
    <h1 class="h4 mb-3">Fila de Chamados</h1>

    <form id="form-busca" class="row g-2 mb-3" role="search">
      <div class="col">
        <input type="search" class="form-control" id="ticket" inputmode="numeric"
               placeholder="Buscar por nº do ticket" aria-label="Número do ticket">
      </div>
      <div class="col-auto">
        <select class="form-select" id="filtro-status" aria-label="Filtrar por status">
          <option value="">Todos</option>
          <option value="Aberto">Aberto</option>
          <option value="Em Andamento">Em Andamento</option>
        </select>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-outline-zelus" title="Buscar" aria-label="Buscar">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </form>

    <div id="alerta"></div>

    <!-- Ordenada pela API: os mais urgentes (SLA mais perto de vencer) primeiro -->
    <div id="lista-chamados">
      <p class="texto-suave">Carregando...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/sindico/worklist.js"></script>
</body>
</html>
