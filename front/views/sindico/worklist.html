<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila de chamados | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body data-protegida>
    <header id="cabecalho"></header>

    <!-- 1.10 Tela Fila de Chamados - Worklist (RF10, RN04, RN14) -->
    <main class="container pagina conteudo">
        <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar</a>
        <h1 class="h4 titulo-pagina mb-3">Fila de chamados</h1>

        <form id="form-busca" class="row g-2 mb-3" role="search">
            <div class="col">
                <input type="search" class="form-control" id="ticket" inputmode="numeric"
                       placeholder="Buscar por nº do ticket" aria-label="Número do ticket">
            </div>
            <div class="col-auto">
                <select class="form-select" id="filtro-status" aria-label="Filtrar por status">
                    <option value="">Todos</option>
                    <option value="Aberto">Aberto</option>
                    <option value="Em Andamento">Em andamento</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-secondary bg-white" title="Buscar">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>

        <div id="alerta"></div>

        <!-- Ordenada pela API: os mais urgentes (SLA mais perto de vencer) primeiro -->
        <div id="lista-chamados">
            <p class="texto-suave">Carregando...</p>
        </div>
    </main>

    <script type="module" src="../../scripts/sindico/worklist.js"></script>
</body>
</html>
