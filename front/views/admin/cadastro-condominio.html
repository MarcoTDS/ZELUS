<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Condomínio | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do cabeçalho (usados pelo layout.js) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <main class="zelus-pagina">

    <a href="dashboard.html" class="link-zelus small">&larr; Voltar ao dashboard</a>

    <form id="form-condominio" class="card shadow-sm mt-2" novalidate>
      <div class="card-body p-4">

        <p class="rotulo-pagina">Administrador</p>
        <h1 class="h4 mb-3" id="titulo">Cadastrar Condomínio</h1>

        <!-- Retorno do envio (sucesso / erro) -->
        <div id="alerta" class="mb-3"></div>

        <!-- ===== Dados do condomínio ===== -->
        <div class="mb-3">
          <label for="nome" class="form-label small">Nome do Condomínio</label>
          <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Residencial Jardim das Flores" maxlength="120" required>
          <div class="invalid-feedback">Informe o nome do condomínio.</div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-4">
            <label for="cep" class="form-label small">CEP</label>
            <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" pattern="\d{5}-\d{3}" required>
            <div class="invalid-feedback">CEP no formato 00000-000.</div>
            <div class="form-text" id="status-cep"></div>
          </div>
          <div class="col-md-8">
            <label for="rua" class="form-label small">Rua</label>
            <input type="text" class="form-control" id="rua" name="rua" maxlength="150" required>
            <div class="invalid-feedback">Informe a rua.</div>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-4 col-md-3">
            <label for="numeroEndereco" class="form-label small">Número</label>
            <input type="text" class="form-control" id="numeroEndereco" name="numero" maxlength="10" required>
            <div class="invalid-feedback">Informe o número.</div>
          </div>
          <div class="col-8 col-md-9">
            <label for="bairro" class="form-label small">Bairro</label>
            <input type="text" class="form-control" id="bairro" name="bairro" maxlength="100" required>
            <div class="invalid-feedback">Informe o bairro.</div>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-8 col-md-9">
            <label for="cidade" class="form-label small">Cidade</label>
            <input type="text" class="form-control" id="cidade" name="cidade" maxlength="100" required>
            <div class="invalid-feedback">Informe a cidade.</div>
          </div>
          <div class="col-4 col-md-3">
            <label for="uf" class="form-label small">UF</label>
            <!-- As UFs são preenchidas pelo script -->
            <select class="form-select" id="uf" name="estado" required>
              <option value="" selected>--</option>
            </select>
            <div class="invalid-feedback">Escolha a UF.</div>
          </div>
        </div>

        <!-- ===== Unidades: só no cadastro novo ===== -->
        <div id="secao-unidades">
          <hr class="my-4">

          <h2 class="h6 fw-semibold mb-2">Unidades do Condomínio</h2>

          <div class="row g-2 align-items-start">
            <div class="col-12 col-md-3">
              <select class="form-select" id="tipo_unidade" aria-label="Tipo de unidade">
                <option value="Apartamento" selected>Apartamento</option>
                <option value="Casa">Casa</option>
                <option value="Area Comum">Área comum</option>
              </select>
            </div>

            <!-- Os campos mudam conforme o tipo escolhido -->
            <div class="col-6 col-md" id="colCampo1">
              <input type="text" class="form-control" id="campo1" maxlength="60">
            </div>
            <div class="col-6 col-md" id="coluna-campo2">
              <input type="text" class="form-control" id="campo2" maxlength="20">
            </div>

            <div class="col-12 col-md-auto d-grid">
              <button type="button" class="btn btn-outline-zelus" id="btn-adicionar">+ Adicionar</button>
            </div>
          </div>

          <div id="alerta-unidade" class="mt-2"></div>
          <!-- Lista preenchida pelo script (na edição, as unidades já gravadas) -->
          <div id="lista-unidades" class="mt-2"></div>
        </div>

        <button type="submit" class="btn btn-zelus w-100 mt-4" id="btn-salvar">Cadastrar Condomínio</button>

      </div>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/admin/cadastro-condominio.js"></script>
</body>
</html>
