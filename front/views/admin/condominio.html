<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condomínio | Zelus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
</head>
<body data-protegida>
    <header id="cabecalho"></header>

    <!-- 1.20 Tela de Cadastro de Condomínio (RF12). Com ?id=N, a mesma tela edita o condomínio (RN15) -->
    <main class="container pagina conteudo">
        <a href="dashboard.html" class="small"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>

        <div class="cartao mt-2">
            <h1 class="h4 titulo-pagina mb-3">
                <span class="sobretitulo">Administrador</span>
                <span id="titulo">Cadastrar condomínio</span>
            </h1>

            <div id="alerta"></div>

            <form id="form-condominio" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do condomínio</label>
                    <input type="text" class="form-control" id="nome" name="nome"
                           placeholder="Ex: Residencial Jardim das Flores" minlength="3" maxlength="100" required>
                    <div class="invalid-feedback">Informe o nome (mínimo de 3 caracteres).</div>
                </div>

                <div class="row g-2">
                    <div class="col-sm-4 mb-3">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="cep" name="cep" inputmode="numeric"
                               placeholder="00000-000" pattern="\d{5}-\d{3}" maxlength="9" required>
                        <div class="invalid-feedback">Informe o CEP no formato 00000-000.</div>
                        <!-- Mensagens da busca no ViaCEP ("Buscando endereço...", "CEP não encontrado") -->
                        <div id="status-cep" class="form-text" aria-live="polite"></div>
                    </div>
                    <div class="col-sm-8 mb-3">
                        <label for="rua" class="form-label">Rua</label>
                        <input type="text" class="form-control" id="rua" name="rua" maxlength="150" required>
                        <div class="invalid-feedback">Informe a rua.</div>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-sm-3 mb-3">
                        <label for="numero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="numero" name="numero" maxlength="6" required>
                        <div class="invalid-feedback">Informe o número.</div>
                    </div>
                    <div class="col-sm-9 mb-3">
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="bairro" name="bairro" maxlength="100" required>
                        <div class="invalid-feedback">Informe o bairro.</div>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-8 col-sm-9 mb-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidade" name="cidade" maxlength="100" required>
                        <div class="invalid-feedback">Informe a cidade.</div>
                    </div>
                    <div class="col-4 col-sm-3 mb-3">
                        <label for="estado" class="form-label">UF</label>
                        <select class="form-select" id="estado" name="estado" required>
                            <option value="">--</option>
                        </select>
                        <div class="invalid-feedback">Selecione a UF.</div>
                    </div>
                </div>

            </form>

            <!-- Unidades: no cadastro vão junto com o condomínio; na edição são gravadas na hora.
                 Ficam fora do <form> para não entrarem na validação do endereço. -->
            <section id="secao-unidades">
                <hr>
                <h2 class="titulo-secao mt-0">Unidades do condomínio</h2>

                <div class="row g-2 align-items-start" id="nova-unidade">
                    <div class="col-sm-3">
                        <select class="form-select" id="tipo_unidade" aria-label="Tipo da unidade">
                            <option value="Apartamento">Apartamento</option>
                            <option value="Casa">Casa</option>
                            <option value="Area Comum">Área comum</option>
                        </select>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="campo1" maxlength="150">
                    </div>
                    <div class="col" id="coluna-campo2">
                        <input type="text" class="form-control" id="campo2" maxlength="50">
                    </div>
                    <div class="col-auto">
                        <button type="button" id="btn-adicionar" class="btn btn-outline-secondary">+ Adicionar</button>
                    </div>
                </div>
                <div id="alerta-unidade" class="mt-2"></div>

                <div id="lista-unidades" class="mt-2"></div>
            </section>

            <!-- O atributo form="..." liga este botão ao formulário do endereço -->
            <button type="submit" form="form-condominio" id="btn-salvar" class="btn btn-zelus w-100 mt-3">Cadastrar condomínio</button>
        </div>
    </main>

    <script type="module" src="../../scripts/admin/condominio.js"></script>
</body>
</html>
