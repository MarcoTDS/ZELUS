<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Administrador | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões da lista (usados pelo layout.js e pelo dashboard.js) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <main class="zelus-pagina">

    <p class="rotulo-pagina">Dashboard</p>
    <h1 class="h3 mb-3">Administrador</h1>

    <div id="alerta"></div>

    <!-- Atalhos -->
    <div class="d-grid gap-2 mb-4">
      <a href="cadastro-condominio.html" class="btn-atalho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <line x1="9" y1="22" x2="9" y2="18"/>
          <line x1="15" y1="22" x2="15" y2="18"/>
          <line x1="9" y1="18" x2="15" y2="18"/>
          <line x1="8" y1="6" x2="8" y2="6.01"/>
          <line x1="12" y1="6" x2="12" y2="6.01"/>
          <line x1="16" y1="6" x2="16" y2="6.01"/>
          <line x1="8" y1="10" x2="8" y2="10.01"/>
          <line x1="12" y1="10" x2="12" y2="10.01"/>
          <line x1="16" y1="10" x2="16" y2="10.01"/>
          <line x1="8" y1="14" x2="8" y2="14.01"/>
          <line x1="12" y1="14" x2="12" y2="14.01"/>
          <line x1="16" y1="14" x2="16" y2="14.01"/>
        </svg>
        Cadastrar Condomínio
      </a>

      <a href="cadastro-sindico.html" class="btn-atalho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="4"/>
          <path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="16" y1="11" x2="22" y2="11"/>
        </svg>
        Cadastrar Síndico
      </a>
    </div>

    <!-- Lista de condomínios -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="h6 fw-semibold mb-0">Condomínios Cadastrados</h2>

      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch" id="mostrar-inativos">
        <label class="form-check-label small" for="mostrar-inativos">Mostrar Inativos</label>
      </div>
    </div>

    <!-- Dados do novo acesso do síndico (link e senha provisória), preenchido pelo script -->
    <div id="acesso-sindico"></div>

    <!-- Lista preenchida pelo script, com os dados do banco -->
    <div id="lista-condominios"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/admin/dashboard.js"></script>
</body>
</html>
