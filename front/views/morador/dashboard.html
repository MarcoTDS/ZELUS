<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Morador | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu (usados pelo layout.js) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>

<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <main class="zelus-pagina">

    <p class="rotulo-pagina">Dashboard</p>
    <h1 class="h3 mb-0">Morador</h1>
    <p class="small text-muted mb-3" id="info-morador"></p>

    <div id="alerta"></div>

    <!-- Atalho principal -->
    <div class="d-grid gap-2 mb-4">
      <a href="novo-chamado.html" class="btn-atalho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Abrir Chamado
      </a>
    </div>

    <!-- Meus chamados -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="h6 fw-semibold mb-0">Meus Chamados</h2>
      <span class="small text-muted" id="resumo-lista"></span>
    </div>

    <!-- Busca por número -->
    <form class="d-flex gap-2 mb-3" id="form-busca" role="search">
      <input type="text" class="form-control" id="busca" placeholder="Buscar por nº do ticket" inputmode="numeric" aria-label="Buscar por número do ticket">
      <button type="submit" class="btn btn-outline-zelus" title="Buscar" aria-label="Buscar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <!-- Lista preenchida pelo script, com os dados do banco -->
    <div id="lista-chamados">
      <p class="texto-suave">Carregando chamados...</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/morador/dashboard.js"></script>
</body>
</html>
