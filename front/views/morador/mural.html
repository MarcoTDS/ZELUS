<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mural do Condomínio | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões (usados pelo layout.js e por esta tela) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>
<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <!-- Tela Mural do Condomínio (RF17, RN05) -->
  <main class="zelus-pagina">

    <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>

    <p class="rotulo-pagina mt-3">Morador</p>
    <h1 class="h3 mb-1">Mural do Condomínio</h1>
    <p class="small texto-suave mb-3">
      Todos os chamados do condomínio. Assim você vê se o problema já foi registrado antes de abrir outro.
    </p>

    <!-- Busca por número -->
    <form class="d-flex gap-2 mb-2" id="form-busca" role="search">
      <input type="search" class="form-control" id="ticket" placeholder="Buscar por nº do ticket"
             inputmode="numeric" aria-label="Buscar por número do ticket">
      <button type="submit" class="btn btn-outline-zelus" title="Buscar" aria-label="Buscar">
        <i class="bi bi-search"></i>
      </button>
    </form>

    <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
      <span class="small texto-suave" id="resumo"></span>
      <select class="form-select form-select-sm w-auto" id="filtro-status" aria-label="Filtrar por situação">
        <option value="abertos" selected>Em Aberto</option>
        <option value="finalizados">Resolvidos e Cancelados</option>
        <option value="">Todos</option>
      </select>
    </div>

    <div id="alerta"></div>

    <!-- Lista preenchida pelo script, com os dados do banco -->
    <div id="lista-chamados">
      <p class="texto-suave">Carregando...</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/morador/mural.js"></script>
</body>
</html>
