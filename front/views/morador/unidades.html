<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas Unidades | Zelus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do menu e dos botões (usados pelo layout.js e por esta tela) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../styles/global.css" rel="stylesheet">
  <script src="../../scripts/shared/tema.js"></script>
</head>
<body data-protegida>

  <!-- Cabeçalho montado pelo layout.js (logo, usuário, Sair e tema) -->
  <header id="cabecalho"></header>

  <!-- Minhas Unidades (RF06): o morador acompanha as unidades dele e pede vínculo com outras -->
  <main class="zelus-pagina">
    <a href="dashboard.html" class="voltar"><i class="bi bi-arrow-left"></i> Voltar ao dashboard</a>
    <h1 class="h4 mb-3">Minhas Unidades</h1>

    <div id="alerta"></div>

    <div id="lista-vinculos" class="mb-4">
      <p class="texto-suave">Carregando...</p>
    </div>

    <form id="form-solicitar" class="cartao" novalidate>
      <h2 class="h6 fw-semibold mb-1">Solicitar outra unidade</h2>
      <p class="small texto-suave mb-3">A nova unidade fica pendente até a aprovação do síndico.</p>
      <div class="row g-2">
        <div class="col">
          <select class="form-select" id="unidade" aria-label="Unidade" required>
            <option value="">Carregando...</option>
          </select>
          <div class="invalid-feedback">Selecione a unidade.</div>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-zelus" id="btn-solicitar">Solicitar</button>
        </div>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../../scripts/morador/unidades.js"></script>
</body>
</html>
